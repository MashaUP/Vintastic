name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Controlli e test unitari
        run: npm test
      - name: Pacchetto di prova
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: vintastic-build-${{ github.sha }}
          path: dist/*.zip*
          retention-days: 14
